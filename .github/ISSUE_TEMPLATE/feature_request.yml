name: Feature request
description: Suggest an idea for YORU
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature and the gameplay problem it solves. Check ROADMAP.md first — it may already be tracked.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay / physics
        - Rival AI
        - Graphics / performance
        - Audio
        - UI / menus
        - Content (worlds, bikes)
        - Other
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU / browser (optional)
      description: Only needed if the request is about performance on your machine. For measured numbers, run with ?bench=1 and mention your yoru-bench-*.json p50/p95.
